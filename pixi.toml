[workspace]
authors = ["Kamil Kania <kkania388@gmail.com>"]
channels = ["conda-forge"]
name = "lab"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
lab02 = "quarto render lab02/lab02.ipynb --to pdf --execute"
lab03 = "quarto render lab03/lab03.ipynb --to pdf"
lab04 = "quarto render lab04/lab04.ipynb --to pdf"

test = { depends-on =
  [
    "lab02",
    "lab03",
    "lab04",
  ]
}

[dependencies]
python = "3.14.*"
numpy = ">=2.5.3,<3"
scipy = ">=1.18.1,<2"
matplotlib = ">=3.11.2,<4"
jupyter = ">=1.1.1,<2"
quarto = ">=1.9.38,<2"
ipykernel = ">=7.4.0,<8"
nbstripout = ">=0.9.1,<0.10"
